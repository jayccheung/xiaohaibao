name = "xiaohaibao"
compatibility_date = "2026-01-01"
pages_build_output_dir = "dist"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "xiaohaibao"
database_id = "placeholder-replace-after-create"

# R2 Bucket
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "xiaohaibao-assets"

# Environment variables (set via dashboard, not committed)
# PLATFORM_DEEPSEEK_KEY
# PLATFORM_IMAGE2_KEY
# JWT_SECRET

[vars]
APP_NAME = "小海豹"
APP_URL = "https://xiaohaibao.pages.dev"
